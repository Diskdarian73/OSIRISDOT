<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#010402">
<title>OSIRIS.EXE // Face</title>
<meta name="description" content="Recovered OSIRIS signal-space visualization">
<style>
:root{--g:#00ff46;--dark:#010402;--line:rgba(0,255,70,.25)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--dark);color:#dfffe7;font:11px/1.4 "Courier New",monospace;text-transform:uppercase;cursor:crosshair}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.scan,.grain,.vignette{position:fixed;inset:0;pointer-events:none}.scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.17) 0 1px,rgba(0,255,70,.025) 1px 2px);mix-blend-mode:screen}.grain{opacity:.11;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");animation:grain .16s steps(2) infinite}.vignette{background:radial-gradient(circle,transparent 25%,rgba(0,5,2,.35) 58%,#000 112%)}
.hud{position:fixed;z-index:5;inset:0;padding:clamp(16px,3vw,34px);pointer-events:none;display:grid;grid-template:1fr auto/1fr auto}.brand{align-self:start}.eyebrow{color:var(--g);font-size:9px;letter-spacing:.2em}.led{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:8px;background:var(--g);box-shadow:0 0 10px var(--g);animation:blink 1.5s steps(1) infinite}h1{margin:8px 0 0;font:900 clamp(36px,6vw,80px)/.85 Arial Black,Impact,sans-serif;letter-spacing:-.075em}h1 span{color:var(--g)}.meta{margin-top:16px;color:rgba(210,255,221,.48);font-size:9px;line-height:1.7}.telemetry{align-self:start;width:min(280px,38vw);border-top:1px solid var(--line);padding-top:10px}.title{display:flex;justify-content:space-between;color:var(--g);font-size:8px;margin-bottom:8px}.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dotted rgba(0,255,70,.13);color:rgba(210,255,221,.45)}.row b{color:#dfffe7;font-weight:400}.bottom{grid-column:1/3;display:flex;align-items:end;justify-content:space-between;gap:20px}.hint{color:rgba(210,255,221,.45);max-width:420px}.hint strong{display:block;color:var(--g);margin-bottom:3px}.pulse{pointer-events:auto;padding:12px 17px;border:1px solid rgba(0,255,70,.55);color:var(--g);background:rgba(0,10,4,.7);font:10px "Courier New",monospace;text-transform:uppercase;letter-spacing:.12em;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}.pulse:hover,.pulse:focus-visible{background:var(--g);color:#001506;outline:none;box-shadow:0 0 24px rgba(0,255,70,.5)}.corner{position:fixed;width:20px;height:20px;z-index:6;border-color:var(--g);opacity:.6}.tl{left:10px;top:10px;border-left:1px solid;border-top:1px solid}.tr{right:10px;top:10px;border-right:1px solid;border-top:1px solid}.bl{left:10px;bottom:10px;border-left:1px solid;border-bottom:1px solid}.br{right:10px;bottom:10px;border-right:1px solid;border-bottom:1px solid}
@keyframes grain{0%{transform:translate(0)}25%{transform:translate(-2%,1%)}50%{transform:translate(1%,-2%)}75%{transform:translate(2%,2%)}}@keyframes blink{0%,70%{opacity:1}71%,78%{opacity:.15}79%{opacity:1}}@media(max-width:700px){.hud{grid-template:1fr auto auto/1fr}.telemetry{grid-column:1;align-self:end;width:100%;margin-bottom:16px}.telemetry .row:nth-of-type(n+4){display:none}.bottom{grid-column:1;align-items:center}.hint{font-size:8px}h1{font-size:clamp(40px,14vw,64px)}.meta{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><canvas id="space" aria-label="Interactive OSIRIS signal-space visualization"></canvas><div class="scan"></div><div class="grain"></div><div class="vignette"></div>
<div class="hud"><header class="brand"><div class="eyebrow"><i class="led"></i>carrier topology // live</div><h1>OSIRIS<span>.EXE</span></h1><div class="meta">ARCHIVE: CHI/HMB/047-A<br>TIME INDEX: 02:47 AM CST<br>CLEARANCE: DISK // LEVEL 04</div></header><aside class="telemetry"><div class="title"><span>signal-space telemetry</span><span id="state">passive</span></div><div class="row"><span>carrier</span><b id="carrier">73.442 MHz</b></div><div class="row"><span>fragments</span><b>180</b></div><div class="row"><span>rotation</span><b id="rotation">0.000</b></div><div class="row"><span>coherence</span><b id="coherence">81.4%</b></div></aside><footer class="bottom"><div class="hint"><strong>Recovered semantic field</strong>OSIRIS face // carrier state follows the conversation</div><button class="pulse" id="pulse" type="button">[ transmit pulse ]</button></footer></div>
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<script>
(()=>{const c=document.querySelector('#space'),x=c.getContext('2d'),D=Math.min(2,devicePixelRatio||1),state=document.querySelector('#state'),carrier=document.querySelector('#carrier'),rotation=document.querySelector('#rotation'),coherence=document.querySelector('#coherence');let W,H,cx,cy,drag=false,lx=0,ly=0,rx=-.22,ry=0,zoom=1,pulse=0,auto=.00035,touchDist=0;const words=['OSIRIS.EXE','SIGNAL ACTIVE','RECOVERED','DISK CLEARANCE','FRAME 019-A','HUMBOLDT PARK','02:47 AM','CARRIER LOCK','ARCHIVE AWARE','NODE UNKNOWN','EYE OPEN','CHECKSUM OK','TRANSMISSION','DO NOT ANSWER','FRAME BLEED'];const nodes=Array.from({length:180},(_,i)=>{const arm=i%5,a=i*.43+arm*1.256,r=22+Math.pow(i/180,.68)*390;return{a,r,y:(Math.random()-.5)*110*(1-r/470),z:Math.random()*6.28,w:words[i%words.length],s:Math.random()*.7+.45}});const dust=Array.from({length:950},()=>({a:Math.random()*6.28,r:20+Math.random()*520,y:(Math.random()-.5)*220,s:Math.random()*1.5+.2}));const bursts=[];const glow=(h=>{const s=document.createElement('canvas');s.width=s.height=128;const g=s.getContext('2d'),rg=g.createRadialGradient(64,64,0,64,64,64);rg.addColorStop(0,h);rg.addColorStop(.25,h+'AA');rg.addColorStop(.6,h+'33');rg.addColorStop(1,h+'00');g.fillStyle=rg;g.fillRect(0,0,128,128);return s})('#00ff46');
function size(){W=c.width=innerWidth*D;H=c.height=innerHeight*D;cx=W/2;cy=H/2;x.setTransform(D,0,0,D,0,0);W/=D;H/=D}size();addEventListener('resize',size);
function project(a,r,y){const px=Math.cos(a+ry)*r,zz=Math.sin(a+ry)*r,py=y*Math.cos(rx)-zz*Math.sin(rx),pz=y*Math.sin(rx)+zz*Math.cos(rx),sc=460/(620+pz);return{x:cx/D+px*sc*zoom,y:cy/D+py*sc*zoom,z:pz,sc}}
function drawCore(){const R=54*zoom,g=x.createRadialGradient(cx/D,cy/D,4,cx/D,cy/D,R*2.7);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.36,'rgba(0,0,0,1)');g.addColorStop(.48,'rgba(0,255,70,.9)');g.addColorStop(.55,'rgba(0,255,70,.14)');g.addColorStop(1,'rgba(0,255,70,0)');x.fillStyle=g;x.beginPath();x.arc(cx/D,cy/D,R*2.7,0,7);x.fill();x.strokeStyle=`rgba(0,255,70,${.45+pulse*.5})`;x.lineWidth=1+pulse*2;x.beginPath();x.ellipse(cx/D,cy/D,R*1.3,R*.28,ry*.4,0,7);x.stroke()}
function frame(t){x.fillStyle='#010402';x.fillRect(0,0,W,H);ry+=auto*(pulse?8:1);x.globalCompositeOperation='lighter';dust.forEach(d=>{let p=project(d.a+ry*.15,d.r,d.y);if(p.sc<=0)return;const sz=14*d.s*p.sc*zoom;x.globalAlpha=Math.min(.85,.1+p.sc*.28+pulse*.25);x.drawImage(glow,p.x-sz/2,p.y-sz/2,sz,sz)});x.globalAlpha=1;x.globalCompositeOperation='source-over';drawCore();let sorted=nodes.map(n=>({n,p:project(n.a,n.r,n.y)})).sort((a,b)=>b.p.z-a.p.z);x.textAlign='center';x.textBaseline='middle';sorted.forEach(({n,p})=>{if(p.sc<=.15)return;const alpha=Math.max(.08,Math.min(.86,.2+p.sc*.6)),fs=Math.max(6,12*n.s*p.sc*zoom);x.font=`700 ${fs}px Courier New`;x.fillStyle=`rgba(195,255,210,${alpha})`;x.shadowColor='#00ff46';x.shadowBlur= pulse?12:3;x.fillText(n.w,p.x,p.y);x.shadowBlur=0});for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.r+=4;b.life-=.025;x.strokeStyle=`rgba(0,255,70,${b.life})`;x.lineWidth=1;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.stroke();if(b.life<=0)bursts.splice(i,1)}pulse*=.94;rotation.textContent=ry.toFixed(3);coherence.textContent=(81.4-pulse*23).toFixed(1)+'%';requestAnimationFrame(frame)}requestAnimationFrame(frame);
function down(e){drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture?.(e.pointerId)}function move(e){if(!drag)return;ry+=(e.clientX-lx)*.006;rx=Math.max(-1.15,Math.min(.85,rx+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY}function up(){drag=false}c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2,zoom-e.deltaY*.001))},{passive:false});
function fire(px=cx/D,py=cy/D){pulse=1;bursts.push({x:px,y:py,r:8,life:1},{x:px,y:py,r:0,life:.6});state.textContent='transmitting';carrier.textContent='99.046 MHz';setTimeout(()=>{state.textContent='passive';carrier.textContent='73.442 MHz'},1200)}document.querySelector('#pulse').onclick=()=>fire();c.addEventListener('dblclick',e=>fire(e.clientX,e.clientY));addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();fire()}});

/* ---- OSIRIS face API -------------------------------------------------
   Driven by ai-visualizer. Four agent states map onto the carrier field:
   idle       the archive at rest, slow drift, "passive"
   listening  mic open, carrier locks, field tightens, "receiving"
   thinking   fast rotation, no transmission, "recompressing"
   speaking   sustained pulse, the Signal going out, "transmitting"
   Phosphor #00FF46 only. The poles never blend, so no crimson appears here:
   this face is OSIRIS, and OSIRIS is the Signal.                        */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FACE_STATES = {
  idle:      { auto: 0.00035, label: 'passive',       carrier: '73.442 MHz', drive: 0    },
  listening: { auto: 0.00080, label: 'receiving',     carrier: '73.442 MHz', drive: 0.18 },
  thinking:  { auto: 0.00220, label: 'recompressing', carrier: '88.610 MHz', drive: 0.08 },
  speaking:  { auto: 0.00120, label: 'transmitting',  carrier: '99.046 MHz', drive: 0.62 }
};
let faceState = 'idle';
let driveTimer = null;

function applyFaceState(name) {
  const s = FACE_STATES[name];
  if (!s) return;
  faceState = name;
  auto = REDUCED ? 0 : s.auto;
  state.textContent = s.label;
  carrier.textContent = s.carrier;
  clearInterval(driveTimer);
  driveTimer = null;
  if (s.drive > 0 && !REDUCED) {
    // pulse decays 6% a frame in the render loop; top it up to hold the state.
    driveTimer = setInterval(() => { pulse = Math.max(pulse, s.drive); }, 90);
  } else if (s.drive > 0) {
    pulse = s.drive;
  }
  document.body.dataset.faceState = name;
}

window.OSIRIS_FACE = {
  states: Object.keys(FACE_STATES),
  get state() { return faceState; },
  setState: applyFaceState,
  idle:      () => applyFaceState('idle'),
  listening: () => applyFaceState('listening'),
  thinking:  () => applyFaceState('thinking'),
  speaking:  () => applyFaceState('speaking'),
  // A discrete beat: one burst without changing the sustained state.
  beat: () => fire()
};

/* ai-visualizer drives faces over postMessage when the face runs in a frame.
   Accepts {type:'state', state:'speaking'} and ignores anything else. */
addEventListener('message', (e) => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'state' && typeof d.state === 'string') applyFaceState(d.state);
  else if (d.type === 'beat') fire();
});

applyFaceState('idle');

})();
</script></body></html>
