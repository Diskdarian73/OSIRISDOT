<style>
  :root {
    color-scheme: dark;
    --ink: #01040a;
    --text: #eafff1;
    --gold: #ffcf5c;     /* hour */
    --violet: #8d6bff;   /* minute */
    --phos: #33ff77;     /* second / signal */
    --net: #ff5a2c;      /* network accent */
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
  body { font-family: ui-monospace, "Courier New", SFMono-Regular, Menlo, Consolas, monospace; color: var(--text); }
  canvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: grab; outline: none;
  }
  canvas:active { cursor: grabbing; }
  canvas:focus-visible { box-shadow: inset 0 0 0 3px var(--phos); }

  /* CRT scanlines + vignette, matching the archive aesthetic */
  .crt, .vig { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .crt {
    background: repeating-linear-gradient(0deg,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.16) 3px);

  }

  .readout {
    position: fixed; z-index: 4;
    left: max(20px, env(safe-area-inset-left));
    top: max(18px, env(safe-area-inset-top));
    padding: 10px 14px 12px 12px;
    border-left: 2px solid rgba(51, 255, 119, 0.6);
    pointer-events: none;
    text-shadow: 0 2px 12px #000, 0 0 8px rgba(51,255,119,0.35);
    background: linear-gradient(90deg, rgba(2, 10, 6, 0.78), transparent);
  }
  .brand {
    display: flex; align-items: baseline; gap: 0.5rem;
    font-size: clamp(15px, 2vw, 24px); font-weight: 700;
    letter-spacing: 0.26em; color: var(--phos); line-height: 1;
  }
  .brand .ankh { color: var(--gold); font-weight: 400; }
  .tag {
    display: block; margin-top: 5px;
    font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase;

  }
  .time {
    display: block; margin-top: 12px;
    color: rgba(234, 255, 241, 0.92);
    font-size: clamp(15px, 1.9vw, 22px); line-height: 1; font-weight: 600;
    letter-spacing: 0.12em; font-variant-numeric: tabular-nums;
  }
  .legend {
    display: flex; gap: 0.85rem; margin: 8px 0 0;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;

  .legend .h { color: var(--gold); }
  .legend .m { color: var(--violet); }
  .legend .s { color: var(--phos); }

  .status-hud {
    position: fixed; z-index: 4;
    left: max(20px, env(safe-area-inset-left));
    bottom: max(16px, env(safe-area-inset-bottom));
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: rgba(51, 255, 119, 0.62); pointer-events: none;
    text-shadow: 0 0 6px rgba(51,255,119,0.4);
  }
  .status-hud .dim { color: rgba(141, 107, 255, 0.66); }
  .corner {
    position: fixed; z-index: 4; right: max(20px, env(safe-area-inset-right));
    top: max(18px, env(safe-area-inset-top));
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    text-align: right; color: rgba(51,255,119,0.6); pointer-events: none;
    text-shadow: 0 0 6px rgba(51,255,119,0.4);
  }
  .backlink {
    position: fixed; z-index: 5;
    right: max(20px, env(safe-area-inset-right));
    bottom: max(16px, env(safe-area-inset-bottom));
    font-family: "Courier New", Courier, monospace;
    font-size: 11px; letter-spacing: 0.16em;
    color: rgba(51,255,119,0.72); text-decoration: none;
    text-shadow: 0 0 6px rgba(51,255,119,0.45);
    transition: opacity 150ms; opacity: 0.7;
  }
  .backlink:hover { opacity: 1; text-shadow: 0 0 10px rgba(51,255,119,0.8); }
  .blink { animation: blink 1.3s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  @media (max-width: 560px) {
    .time { font-size: 14px; }
    .legend { font-size: 9px; gap: 0.55rem; }
    .brand { letter-spacing: 0.18em; }
  }
  @media (max-height: 480px) { .legend { display: none; } }
  @media (prefers-reduced-motion: reduce) { canvas { cursor: default; } }
  @media (forced-colors: active) { canvas:focus-visible { outline: 3px solid Highlight; } }

<main>
  <canvas id="orbit" tabindex="0" role="img" aria-label="OSIRIS.EXE recovered-signal clock is loading local time."></canvas>

<script>
(function () {
  "use strict";
  var canvas = document.getElementById("orbit");
  var ctx = canvas.getContext && canvas.getContext("2d");
  var display = document.getElementById("display");
  var status = document.getElementById("status");
  if (!ctx) {
    status.textContent = "Canvas is unavailable. The local time remains visible.";
    updateClock();
    setInterval(updateClock, 1000);
    return;
  }
  var motion = matchMedia("(prefers-reduced-motion: reduce)");
  var reduced = motion.matches;
  var W = 1, H = 1, DPR = 1, raf = 0;
  var yaw = -0.38, pitch = 0.22, targetYaw = yaw, targetPitch = pitch;
  var auto = !reduced;
  var lastMinute = "", clockStamp = "--:--:--";
  var pointer = { down: false, x: 0, y: 0, id: null };
  var TAU = Math.PI * 2;
  var stars = [], dust = [], sparks = [], streamers = [];
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function seeded(i) {
    var x = Math.sin(i * 1297.31 + 23.9) * 43758.5453;
    return x - Math.floor(x);
  }
  function mix(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function rebuildField() {
    stars = [];
    dust = [];
    sparks = [];
    streamers = [];
    var i, u, v, r, a, z, q;
    for (i = 0; i < 1400; i += 1) {
      u = seeded(i * 4);
      v = seeded(i * 4 + 1);
      r = 3 + seeded(i * 4 + 2) * 26;
      a = u * TAU;
      z = (v * 2 - 1) * r;
      q = Math.sqrt(Math.max(0, r * r - z * z));
      stars.push({
        x: Math.cos(a) * q,
        y: z,
        z: Math.sin(a) * q,
        s: 0.3 + seeded(i * 4 + 3) * 1.5,
        w: seeded(i * 7) > 0.78,
        c: seeded(i * 11)
      });
    }
    for (i = 0; i < 420; i += 1) {
      dust.push({
        phase: seeded(i * 3) * TAU,
        radius: 1.15 + seeded(i * 3 + 1) * 2.35,
        speed: 0.35 + seeded(i * 3 + 2) * 1.4,
        size: 0.4 + seeded(i * 5) * 1.8,
        hue: seeded(i * 9),
        tilt: 0.7 + seeded(i * 13) * 0.5
      });
    }
    for (i = 0; i < 180; i += 1) {
      sparks.push({
        phase: seeded(i * 6 + 1) * TAU,
        radius: 1.05 + seeded(i * 6 + 2) * 0.55,
        speed: 1.8 + seeded(i * 6 + 3) * 3.2,
        size: 0.5 + seeded(i * 6 + 4) * 1.4,
        warm: seeded(i * 8) > 0.62
      });
    }
    for (i = 0; i < 24; i += 1) {
      streamers.push({
        phase: seeded(i * 17) * TAU,
        length: 0.35 + seeded(i * 17 + 1) * 1.1,
        radius: 1.4 + seeded(i * 17 + 2) * 1.8,
        hue: 110 + seeded(i * 17 + 3) * 40,
        speed: 0.08 + seeded(i * 17 + 4) * 0.2
      });
    }
  }
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 1.75);
    W = innerWidth;
    H = innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    rebuildField();
    draw(performance.now());
  }
  function project(x, y, z) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var x1 = x * cy - z * sy;
    var z1 = x * sy + z * cy;
    var y1 = y * cp - z1 * sp;
    var z2 = y * sp + z1 * cp;
    var depth = 28 + z2;
    var scale = Math.min(W, H) * 0.58 / Math.max(8, depth);
    return { x: W / 2 + x1 * scale, y: H / 2 + y1 * scale, s: scale, z: z2 };
  }
  function ellipse(cx, cy, rx, ry, rotation, color, width, blur) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.scale(1, ry / rx);
    ctx.strokeStyle = color;
    ctx.lineWidth = width * rx / ry;
    ctx.shadowColor = color;
    ctx.shadowBlur = blur;
    ctx.beginPath();
    ctx.arc(0, 0, rx, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }
  function lensArc(cx, cy, hole, angle, color, width, length, alpha, weight) {
    weight = weight == null ? 1 : weight;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    ctx.shadowColor = color;
    ctx.shadowBlur = width * (3.2 + weight * 1.4);
    var echoes = weight > 0.85 ? 7 : 5;
    for (var echo = 0; echo < echoes; echo += 1) {
      var radius = hole * (1.1 + echo * (0.024 + weight * 0.01));
      var spread = length * (1 + echo * 0.12);
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha * weight / (echo * 0.85 + 1);
      ctx.lineWidth = Math.max(0.7, width * (1 - echo * 0.11) * weight);
      ctx.beginPath();
      ctx.arc(cx, cy, radius, angle - spread, angle + spread * 0.22);
      ctx.stroke();
    }
    ctx.globalAlpha = alpha * (0.32 + weight * 0.18);
    ctx.lineWidth = Math.max(0.5, width * (0.55 + weight * 0.2));
    ctx.beginPath();
    ctx.arc(cx, cy, hole * 1.22, angle + Math.PI - length * 0.4, angle + Math.PI + length * 0.18);
    ctx.stroke();
    if (weight > 0.85) {
      ctx.globalAlpha = alpha * 0.22;
      ctx.lineWidth = Math.max(0.4, width * 0.35);
      ctx.beginPath();
      ctx.arc(cx, cy, hole * 1.34, angle + Math.PI - length * 0.22, angle + Math.PI + length * 0.1);
      ctx.stroke();
    }
    ctx.restore();
  }
  function handSpoke(cx, cy, hole, angle, color, length, width) {
    var yScale = 0.42 + Math.abs(Math.sin(pitch)) * 0.28;
    var r0 = hole * 1.14;
    var r1 = hole * length;
    var x0 = cx + Math.cos(angle) * r0;
    var y0 = cy + Math.sin(angle) * r0 * yScale;
    var x1 = cx + Math.cos(angle) * r1;
    var y1 = cy + Math.sin(angle) * r1 * yScale;
    ctx.save();
    ctx.lineCap = "round";
    ctx.globalCompositeOperation = "source-over";
    ctx.strokeStyle = "rgba(0,0,4,0.72)";
    ctx.lineWidth = width * 2.4;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    ctx.globalCompositeOperation = "lighter";
    ctx.shadowColor = color;
    ctx.shadowBlur = width * 3.5;
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    ctx.shadowBlur = width * 1.2;
    ctx.strokeStyle = "rgba(255,255,255,0.85)";
    ctx.lineWidth = Math.max(1, width * 0.28);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    ctx.restore();
  }
  function beacon(cx, cy, hole, angle, color, size, orbitR) {
    var r = hole * (orbitR == null ? 1.55 : orbitR);
    var yScale = 0.42 + Math.abs(Math.sin(pitch)) * 0.28;
    var x = cx + Math.cos(angle) * r;
    var y = cy + Math.sin(angle) * r * yScale;
    var gx = cx + Math.cos(angle + Math.PI) * hole * 1.18;
    var gy = cy + Math.sin(angle + Math.PI) * hole * 1.18 * yScale;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var ghost = ctx.createRadialGradient(gx, gy, 0, gx, gy, size * 2.2);
    ghost.addColorStop(0, "rgba(255,255,255,0.35)");
    ghost.addColorStop(0.3, color);
    ghost.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = ghost;
    ctx.beginPath();
    ctx.arc(gx, gy, size * 2.2, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
    var g = ctx.createRadialGradient(x, y, 0, x, y, size * 5.2);
    g.addColorStop(0, "rgba(255,255,255,0.98)");
    g.addColorStop(0.18, color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, size * 5.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.shadowColor = color;
    ctx.shadowBlur = size * 2.4;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.62, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
  function drawGravitationalLensing(cx, cy, hole, t) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var pulse = reduced ? 0.55 : 0.48 + 0.12 * Math.sin(t * 0.0008);
    var warp = ctx.createRadialGradient(cx, cy, hole * 0.92, cx, cy, hole * 2.85);
    warp.addColorStop(0, "rgba(120,255,180,0)");
    warp.addColorStop(0.18, "rgba(51,255,119," + (0.12 * pulse) + ")");
    warp.addColorStop(0.32, "rgba(141,107,255," + (0.12 * pulse) + ")");
    warp.addColorStop(0.48, "rgba(255,207,92," + (0.08 * pulse) + ")");
    warp.addColorStop(0.7, "rgba(255,90,44,0.03)");
    warp.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = warp;
    ctx.beginPath();
    ctx.arc(cx, cy, hole * 2.85, 0, TAU);
    ctx.fill();
    var rings = [
      { r: 1.32, a: 0.24, w: 2.4, c: "rgba(51,255,119," },
      { r: 1.48, a: 0.15, w: 1.8, c: "rgba(141,107,255," },
      { r: 1.68, a: 0.1, w: 1.3, c: "rgba(255,207,92," },
      { r: 1.95, a: 0.06, w: 1, c: "rgba(255,90,44," }
    ];
    var i, ring, phase, spread;
    for (i = 0; i < rings.length; i += 1) {
      ring = rings[i];
      phase = yaw * (0.35 + i * 0.08) + (reduced ? 0 : t * 0.00015 * (1 - i * 0.15));
      spread = 0.55 + i * 0.12;
      ctx.strokeStyle = ring.c + (ring.a * pulse) + ")";
      ctx.lineWidth = ring.w;
      ctx.shadowColor = ring.c + "0.5)";
      ctx.shadowBlur = 10 - i * 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, hole * ring.r, phase, phase + spread);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, hole * ring.r, phase + Math.PI, phase + Math.PI + spread * 0.85);
      ctx.stroke();
      ctx.strokeStyle = rings[(i + 1) % rings.length].c + (ring.a * 0.45 * pulse) + ")";
      ctx.lineWidth = Math.max(0.6, ring.w * 0.55);
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.arc(cx + 1.2, cy - 0.8, hole * (ring.r + 0.018), phase + 0.08, phase + spread * 0.9);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  function drawDiskParticles(cx, cy, hole, t, tilt, rotation) {
    var time = reduced ? 0 : t * 0.001;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.translate(cx, cy);
    ctx.rotate(rotation);
    ctx.scale(1, tilt);
    var i, p, ang, rr, px, py, hue, alpha, sz;
    for (i = 0; i < dust.length; i += 1) {
      p = dust[i];
      ang = p.phase + time * p.speed * (p.radius > 2 ? 0.55 : 1.1);
      rr = hole * p.radius;
      px = Math.cos(ang) * rr;
      py = Math.sin(ang) * rr;
      /* bias hue toward phosphor green / violet */
      hue = (120 + p.hue * 160 + Math.sin(ang + yaw) * 30) % 360;
      alpha = 0.12 + (1 - (p.radius - 1.15) / 2.35) * 0.38;
      sz = p.size * (0.7 + (1 / p.radius) * 0.5);
      ctx.fillStyle = "hsla(" + hue + ",92%," + (56 + p.hue * 20) + "%," + alpha + ")";
      ctx.beginPath();
      ctx.arc(px, py, sz, 0, TAU);
      ctx.fill();
    }
    for (i = 0; i < sparks.length; i += 1) {
      p = sparks[i];
      ang = p.phase - time * p.speed;
      rr = hole * p.radius;
      px = Math.cos(ang) * rr;
      py = Math.sin(ang) * rr;
      if (p.warm) {
        /* network red-orange sparks, used sparingly */
        ctx.fillStyle = "rgba(255," + Math.floor(110 + seeded(i) * 60) + ",44," + (0.4 + Math.sin(time * 4 + i) * 0.2) + ")";
      } else {
        ctx.fillStyle = "rgba(51,255,119," + (0.4 + Math.sin(time * 5 + i) * 0.2) + ")";
      }
      ctx.beginPath();
      ctx.arc(px, py, p.size, 0, TAU);
      ctx.fill();
    }
    if (!reduced) {
      for (i = 0; i < streamers.length; i += 1) {
        p = streamers[i];
        ang = p.phase + time * p.speed;
        rr = hole * p.radius;
        ctx.strokeStyle = "hsla(" + ((p.hue + time * 16) % 360) + ",95%,64%," + 0.14 + ")";
        ctx.lineWidth = 1.2 + (3 - p.radius) * 0.8;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(0, 0, rr, ang, ang + p.length);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  function waveParticles(cx, cy, hole, angle, color, count, length, t, seed0) {
    if (reduced) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < count; i += 1) {
      var u = (i + 0.5) / count;
      var a = angle - length * (1 - u) + Math.sin(t * 0.004 + seed0 + i) * 0.03;
      var r = hole * (1.14 + u * 0.22 + seeded(seed0 + i * 3) * 0.08);
      var x = cx + Math.cos(a) * r;
      var y = cy + Math.sin(a) * r;
      var sz = 0.6 + (1 - u) * 2.2;
      var alpha = 0.15 + (1 - u) * 0.55;
      ctx.fillStyle = color.replace("ALPHA", String(alpha));
      ctx.beginPath();
      ctx.arc(x, y, sz, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  function drawHourTicks(cx, cy, hole, lensTurn) {
    var yScale = 0.55;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < 12; i += 1) {
      var a = (i / 12) * TAU - Math.PI / 2 + lensTurn;
      var major = i % 3 === 0;
      var r0 = hole * 1.78;
      var r1 = hole * (major ? 2.05 : 1.9);
      var x0 = cx + Math.cos(a) * r0;
      var y0 = cy + Math.sin(a) * r0 * yScale;
      var x1 = cx + Math.cos(a) * r1;
      var y1 = cy + Math.sin(a) * r1 * yScale;
      ctx.strokeStyle = major
        ? "rgba(255,215,120,0.55)"
        : "rgba(150,255,190,0.26)";
      ctx.lineWidth = major ? 2 : 1.1;
      ctx.shadowColor = major ? "rgba(255,200,90,0.7)" : "rgba(51,255,119,0.35)";
      ctx.shadowBlur = major ? 8 : 3;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  }
  /* Ankh glyph inside the event shadow — the Eye of Osiris core */
