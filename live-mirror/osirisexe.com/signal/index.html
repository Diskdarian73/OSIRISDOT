<style>
:root {
  --osiris-phosphor: #00ff46;
  --osiris-black: #000;
  --osiris-panel: rgba(0, 5, 1, 0.9);
  --osiris-panel-soft: rgba(0, 8, 2, 0.72);
  --osiris-line: rgba(0, 255, 70, 0.42);
  --osiris-line-soft: rgba(0, 255, 70, 0.2);
}

::-webkit-scrollbar {
  width: 0.625rem;
  height: 0.625rem;
}

::-webkit-scrollbar-thumb {
  background: #111;
  border-radius: 0.3125rem;
  box-shadow: inset 0.125rem 0.125rem 0.125rem rgba(255, 255, 255, 0.25),
    inset -0.125rem -0.125rem 0.125rem rgba(0, 0, 0, 0.25);
  cursor: default;
}

::-webkit-scrollbar-track {
  background: #333;
}

::selection {
  background: #fff;
  color: #333;
}

html,
body {
  height: 100vh;
  height: 100dvh;
  margin: 0;
  overflow: hidden;
}

body {
  display: grid;
  grid-template-rows: calc(100dvh - 4rem) 4rem;
  font-family: system-ui, sans-serif;
}

canvas,
.editor,
#controls {
  grid-row: 1;
  grid-column: 1;
}

canvas {
  --canvas-z-index: -1;
  width: 100%;
  height: auto;
  object-fit: contain;
  background: black;
  touch-action: none;
  z-index: var(--canvas-z-index);
}

.editor,
.overlay,
#error {
  font-family: 'Courier New', Courier, monospace;
  background: repeating-linear-gradient(0deg, #000a, #1119, #000a .25rem);
  padding: 1em;
}

.editor {
  color: #fefefe;
  tab-size: 2;
  border: none;
  resize: none;
}

.editor:focus {
  outline: none;
}

#error {
  grid-row: 2;
  grid-column: 1;
  margin: 0;
  padding-block: 0;
  padding-top: .5em;
  color: firebrick;
  overflow: auto;
  text-wrap: pretty;
}

#indicator {
  visibility: hidden;
  position: absolute;
  top: calc(var(--top, 0px) - var(--scroll-top, 0px));
  width: 0;
  height: 0;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-left: 10px solid firebrick;
  transform: translateY(-25%);
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  margin: 0;
}

.editor,
.overlay {
  font-size: 1rem;
  line-height: 1.2;
  white-space: pre;
}

#controls {
  position: fixed;
  top: 1em;
  right: 2em;
}

.controls {
  position: relative;
  display: flex;
  gap: 1.5em;
  padding: .5em 1.25em;
  background: #1111;
  border-radius: 4px;
}

.controls::before,
.controls::after {
  content: '';
  position: absolute;
  z-index: -1;
  inset: 0;
  transform: scale(.95);
  border-radius: inherit;
  opacity: 0;
}

.controls::before {
  background: #aef;
  animation: pulse 2s infinite;
}

.controls::after {
  background: #fefefe66;
  transition: transform 200ms ease-in-out;
}

.controls:hover::before,
.controls:hover::after {
  opacity: 1;
}

.controls:hover::before {
  transform: scale(.98);
  filter: blur(2px);
}

.controls:hover::after {
  transform: scale(1.025, 1.1);
}

.controls:hover {
  background: #111f;
}

@keyframes pulse {
  0% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.0125);
  }

  100% {
    transform: scale(1);
  }
}

.hidden {
  display: none !important;
}

.opaque {
  opacity: 1 !important;
  background: #111 !important;
}

input {
  all: unset;
  opacity: .2;
  filter: saturate(0) invert(1);
  cursor: pointer;
  transition: opacity 200ms ease-in-out;
  padding: .25em .5em;
}

input:hover {
  opacity: 1;
}

.icon {
  text-align: center;
  line-height: 1;
}

#btnToggleView {
  width: 1.25em;
}

#btnToggleView::after {
  content: '👁';
}

#btnToggleView:checked::after {
  content: '✏️';
}

#btnToggleResolution::after {
  content: '1️⃣';
}

#btnToggleResolution:checked::after {
  content: '2️⃣';
}

#btnReset::after {
  content: '⏮️';
}

#btnPlayStop::after {
  content: '▶️';
}

#btnPlayStop:checked::after {
  content: '⏸️';
}

#signalNav {
  position: fixed;
  top: 1em;
  left: 1.25em;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.45rem;
  border: 1px solid rgba(51, 255, 102, 0.34);
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(6px);
}

#signalNav a {
  display: inline-flex;
  min-height: 2rem;
  align-items: center;
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  color: #33ff66;
  text-decoration: none;
  padding: 0 0.65rem;
  border: 1px solid transparent;
  opacity: 0.72;
  text-shadow: 0 0 6px rgba(51, 255, 102, 0.5);
  transition: opacity 150ms ease-in-out, border-color 150ms ease-in-out;
}

#signalNav a:hover,
#signalNav a:focus-visible {
  opacity: 1;
  border-color: rgba(51, 255, 102, 0.6);
  outline: none;
}

#instagramFeed {
  position: fixed;
  top: 50%;
  left: 50%;
  z-index: 8;
  display: flex;
  width: min(68vw, 45rem);
  max-height: calc(100dvh - 10rem);
  flex-direction: column;
  color: var(--osiris-phosphor);
  border: 1px solid var(--osiris-line);
  background: var(--osiris-panel);
  box-shadow: 0 0 2rem rgba(0, 0, 0, 0.72), inset 0 0 2rem rgba(0, 255, 70, 0.025);
  font-family: 'Courier New', Courier, monospace;
  transform: translate(-50%, -50%);
  backdrop-filter: blur(9px);
}

.instagram-feed-header,
.instagram-feed-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.7rem 0.85rem;
}

.instagram-feed-header {
  border-bottom: 1px solid var(--osiris-line-soft);
}

.instagram-feed-footer {
  border-top: 1px solid var(--osiris-line-soft);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  opacity: 0.66;
}

.instagram-feed-kicker,
.instagram-feed-title,
.instagram-feed-status {
  margin: 0;
}

.instagram-feed-kicker {
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  opacity: 0.62;
}

.instagram-feed-title {
  margin-top: 0.2rem;
  font-size: clamp(0.78rem, 1.2vw, 1rem);
  font-weight: 400;
  letter-spacing: 0.14em;
}

.instagram-feed-profile,
.instagram-feed-empty a {
  color: var(--osiris-phosphor);
  text-decoration: none;
}

.instagram-feed-profile {
  flex: 0 0 auto;
  padding: 0.42rem 0.55rem;
  border: 1px solid var(--osiris-line-soft);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  opacity: 0.75;
}

.instagram-feed-profile:hover,
.instagram-feed-profile:focus-visible,
.instagram-feed-empty a:hover,
.instagram-feed-empty a:focus-visible {
  opacity: 1;
  outline: 1px solid var(--osiris-phosphor);
  outline-offset: 2px;
}

.instagram-feed-status {
  padding: 0.5rem 0.85rem;
  border-bottom: 1px solid var(--osiris-line-soft);
  background: var(--osiris-panel-soft);
  font-size: 0.58rem;
  letter-spacing: 0.15em;
  opacity: 0.72;
}

.instagram-feed-grid {
  display: grid;
  min-height: 0;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1px;
  overflow: auto;
  background: var(--osiris-line-soft);
}

.instagram-feed-card,
.instagram-feed-placeholder {
  position: relative;
  min-width: 0;
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--osiris-black);
}

.instagram-feed-placeholder {
  display: grid;
  place-items: center;
  color: rgba(0, 255, 70, 0.42);
  font-size: 0.58rem;
  letter-spacing: 0.12em;
}

.instagram-feed-placeholder::before {
  content: '[ AWAITING SIGNAL ]';
}

.instagram-feed-card {
  display: block;
  color: var(--osiris-phosphor);
}

.instagram-feed-card img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  filter: saturate(0.82) contrast(1.08);
  transition: filter 180ms ease-in-out, transform 180ms ease-in-out;
}

.instagram-feed-card:hover img,
.instagram-feed-card:focus-visible img {
  filter: saturate(1) contrast(1.03);
  transform: scale(1.025);
}

.instagram-feed-card:focus-visible {
  outline: 2px solid var(--osiris-phosphor);
  outline-offset: -2px;
}

.instagram-feed-caption {
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  max-height: 58%;
  padding: 1.8rem 0.6rem 0.55rem;
  overflow: hidden;
  color: var(--osiris-phosphor);
  background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.95));
  font-size: 0.6rem;
  line-height: 1.35;
  opacity: 0;
  transform: translateY(0.3rem);
  transition: opacity 180ms ease-in-out, transform 180ms ease-in-out;
}

.instagram-feed-card:hover .instagram-feed-caption,
.instagram-feed-card:focus-visible .instagram-feed-caption {
  opacity: 1;
  transform: translateY(0);
}

.instagram-feed-media-type {
  position: absolute;
  top: 0.45rem;
  right: 0.45rem;
  padding: 0.25rem 0.35rem;
  border: 1px solid var(--osiris-line);
  background: rgba(0, 0, 0, 0.78);
  font-size: 0.52rem;
  letter-spacing: 0.1em;
}

.instagram-feed-empty {
  grid-column: 1 / -1;
  display: grid;
  min-height: 16rem;
  place-items: center;
  padding: 2rem;
  background: var(--osiris-panel-soft);
  text-align: center;
}

.instagram-feed-empty strong,
.instagram-feed-empty span,
.instagram-feed-empty a {
  display: block;
}

.instagram-feed-empty strong {
  font-size: 0.82rem;
  font-weight: 400;
  letter-spacing: 0.16em;
}

.instagram-feed-empty span {
  margin-top: 0.65rem;
  font-size: 0.64rem;
  line-height: 1.5;
  letter-spacing: 0.08em;
  opacity: 0.65;
}

.instagram-feed-empty a {
  width: max-content;
  margin: 1.1rem auto 0;
  padding: 0.5rem 0.65rem;
  border: 1px solid var(--osiris-line-soft);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
}

@media (max-width: 48rem) {
  #instagramFeed {
    top: 4.7rem;
    bottom: 1rem;
    width: calc(100vw - 2rem);
    max-height: none;
    transform: translateX(-50%);
  }

  .instagram-feed-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .instagram-feed-footer {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .instagram-feed-card img,
  .instagram-feed-caption {
    transition: none;
  }
}

html.background-mode body {
  display: block;
  overflow: hidden;
}

html.background-mode canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  object-fit: cover;
  --canvas-z-index: 0;
}

html.background-mode #signalNav,
html.background-mode #controls,
html.background-mode .editor,
html.background-mode #error,
html.background-mode #indicator,
html.background-mode #osiris-instagram-link,
html.background-mode #instagramFeed {
  display: none !important;
}
</style>

<script type="x-shader/x-fragment">#version 300 es
/*********
* made by Matthias Hurrle (@atzedent)
*/
precision highp float;
out vec4 O;
uniform float time;
uniform vec2 resolution;
uniform vec2 wheel;
#define FC gl_FragCoord.xy
#define R resolution
#define T (time+wheel.y/1e3)
#define N normalize
#define S smoothstep
#define MN min(R.x,R.y)
#define LP vec3(-2,8,-2)
#define EDGESIZE 42e-4
#define hue(a) (.5+.5*sin(3.14*(a)+vec3(1,2,3)))
// Spline setup for camera path.
// Reference: https://www.shadertoy.com/view/4s3SRN
vec3 cp[14];
void initCam() {
	const float a=2.*.96, b=2.*a;
	cp[0] =vec3(0);
	cp[1] =vec3(0,0,b);
	cp[2] =vec3(a,0,b);
	cp[3] =vec3(a,0,a);
	cp[4] =vec3(a,-a*1.2,a);
	cp[5] =vec3(-a,-a,a);
	cp[6] =vec3(-a,0,a);
	cp[7] =vec3(-a,0,0);
	cp[8] =vec3(0);
	cp[9] =vec3(0,0,-b);
	cp[10]=vec3(0,a,-b);
	cp[11]=vec3(-a,a,-b);
	cp[12]=vec3(-a,0,-b);
	cp[13]=vec3(-a,0,0);
}
vec3 catmull(vec3 a, vec3 b, vec3 c, vec3 d, float t){
	return (((-a+b*3.-c*3.+d)*t*t*t + (a*2.- b*5.+c*4.-d)*t*t + (-a+c)*t + b*2.)*.5);
}
vec3 camPath(float t){
	const int n=14;
	const float k=float(n);
	t=fract(t/k)*k;
	float sn=floor(t), st=t-sn;
	if (sn==.0) return catmull(cp[n-1], cp[0], cp[1], cp[2], st);
	for (int i=1; i<n-2; i++) {
		if (sn==float(i)) return catmull(cp[i-1], cp[i], cp[i+1], cp[i+2], st);
	}
	if (sn==k-2.) return catmull(cp[n-3], cp[n-2], cp[n-1], cp[0], st);
	if (sn==k-1.) return catmull(cp[n-2], cp[n-1], cp[0], cp[1], st);
	return vec3(0);
}
float rnd(vec3 p) {
	p=fract(p*vec3(12.9898,78.233,156.345));
	p+=dot(p,p+34.56);
	return fract(p.x*p.y*p.z);
}
float smin(float a, float b, float k) {
	k*=log(2.);
	float x=b-a;
	return a+x/(1.-exp2(x/k));
}
float box(vec3 p, float s) {
	p=abs(p)-s;
	return length(max(p,.0))+min(.0,max(max(p.x,p.y),p.z));
}
#define ZERO (time*.0)
float map(vec3 p) {
	float e=length(vec2(fract(p.z)-.5,p.y-1.))-.1;
	p.xz=mod(p.xz+1.,2.)-1.;
	float d=box(p,1.), f=1.;
	for(float i=ZERO; i<5.; i++) {
		vec3 a=mod(p*f,2.)-1., r=abs(1.-3.*abs(a));
		f*=2.25;
		float
		da=max(r.x,r.y),
		db=max(r.y,r.z),
		dc=max(r.z,r.x);
		d=max(d,(min(da,min(db,dc))-1.)/f);
	}
	return smin(d,e,1e-2)+2e-3;
}
vec3 norm(vec3 p) {
	float h=1e-3; vec2 k=vec2(-1,1);
	return N(
		k.xyy*map(p+k.xyy*h)+
		k.yxy*map(p+k.yxy*h)+
		k.yyx*map(p+k.yyx*h)+
		k.xxx*map(p+k.xxx*h)
	);
}
bool march(inout vec3 p, vec3 rd, out float dd, out float edge, out float i) {
	bool near;
	// low quality on the outside
	float maxd=abs(p.y)>1.?130.:800.;
	for (; i++<maxd;) {
		float d=map(p);
		if (abs(d)<1e-3) return true;
		if (d>100.) return false;
		if (near && d>EDGESIZE) edge=1.;
		if (d<EDGESIZE) near=true;
		p+=rd*d*.5;
		dd*=d*.5;
	}
}
float calcAO(vec3 p, vec3 n) {
	float occ=.0, sca=1.;
	for (float i=.0; i<5.; i++) {
		float
		h=.01+i*.05,
		d=map(p+h*n);
		occ+=(h-d)*sca;
		sca*=.95;
		if (occ>.35) break;
	}
	return clamp(1.-3.*occ,.0,1.);
}
float getao(vec3 p, vec3 n, float dist) {
	return clamp(map(p+n*dist)/dist,.0,1.);
}
vec3 dir(vec2 uv, vec3 ro, vec3 t, float z) {
	vec3 up=vec3(0,1,0),
	f=N(t-ro),
	r=N(cross(up,f)),
	u=cross(f,r),
	c=f*z,
	i=c+uv.x*r+uv.y*u,
	d=N(i);
	return d;
}
vec3 render(vec2 uv) {
	initCam();
	float speed=T*.25;
	vec3 col=vec3(0),
	p=camPath(-speed+.5), ro=p,
	ta=camPath(-speed),
	rd=dir(uv,p,ta,.6);
	float dd, i, edge;
	if (march(p,rd,dd,edge,i)) {
		float x=mix(.8,1.,rnd(p)), lf=S(80.,30.,length(p.z));
		vec3 n=norm(p)*x, lp=vec3(LP.x,LP.y+lf,LP.z), l=N(lp-p);
		float ao=calcAO(p,n), amb=.8+.2*n.y, ld=distance(lp,p),
		ldd=distance(ro,p), dif=clamp(dot(l,n),.0,1.),
		atten=1./(1.+ldd*.5+ldd*ldd*.25);
		if (abs(p.y)<.992) {
			ao*=(n.y*.5+.55);
			col+=S(-.1,1.,amb*ao)+dif*ao*atten;
			col+=atten*pow(clamp(dot(N(ro-p),n),.0,1.),.8);
		} else col+=dif*ao;
		col+=clamp(dot(-rd,l),.0,1.)*ao*atten;
		col*=vec3(1,.65,.5)+.3*amb*ao*atten;
		col*=tanh(ao*ao);
		// outlines
		float fog=1.-clamp(dd/200.,.0,1.), eo=getao(p,n,EDGESIZE);;
		if(eo<.9) edge=max(edge,max(1.,fog));
		eo=getao(p,n,-EDGESIZE);
		if(eo<.9) edge=max(edge,max(1.,fog));
		float fres=pow(clamp(1.+dot(rd,n),.0,1.),5.);
		// dark
		col*=S(2.,.0,edge)*(1.-fres);
		// light
		vec3 dp=abs(p-ro);
    float ll=.3/tan(length(dp))+T;
		dp=(.5+.5*cos(.78*T-vec3(0,-2,3)*fract(ll)-.5));
		dp=p.y>1.01?vec3(1):.02/dp.bgg;
		col=mix(col,fres*dp,S(.5,3.,edge));
		// fog
		col=S(-.5,2.,col);
	}
	// shine
	float k=max(.3,1.-distance(LP,ro));
	col+=hue(k*k*1.57+1.5)*k*.6;
	// color grading
	col=mix(col,vec3(1,.95,.9),S(.0,15.,distance(p,ro)));
	col+=S(-1.,2.,clamp(i/300.,.0,1.))*k*vec3(1,.65,.5);
	col=S(-.2,.8,col*1.2);
	col=tanh(col*col*col);
	col=sqrt(col);
	// vignette
	vec2 c=FC/R;

<script>
const instagramProfileUrl = 'https://www.instagram.com/diskdarian/'

function instagramCaption(value) {
  if (typeof value !== 'string') return ''
  return value.replace(/\s+/g, ' ').trim()
}

function showInstagramFallback() {
  instagramFeedStatus.textContent = 'FEED AUTHENTICATION PENDING'
  instagramFeedGrid.setAttribute('aria-busy', 'false')
  instagramFeedGrid.replaceChildren()

  const empty = document.createElement('div')
  empty.className = 'instagram-feed-empty'
  empty.innerHTML = '<div><strong>INSTAGRAM UPLINK STANDBY</strong><span>The live channel is ready. Cloudflare is waiting for the private Instagram access key.</span></div>'

  const link = document.createElement('a')
  link.href = instagramProfileUrl
  link.target = '_blank'
  link.rel = 'noopener noreferrer'
  link.textContent = 'VIEW @DISKDARIAN ↗'
  empty.firstElementChild.appendChild(link)
  instagramFeedGrid.appendChild(empty)
}

function renderInstagramFeed(payload) {
  const items = Array.isArray(payload.items) ? payload.items : []
  if (!items.length) {
    showInstagramFallback()
    return
  }

  instagramFeedGrid.replaceChildren()
  const fragment = document.createDocumentFragment()

  for (const item of items) {
    if (!item || typeof item.imageUrl !== 'string' || typeof item.permalink !== 'string') continue

    const caption = instagramCaption(item.caption)
    const username = typeof item.username === 'string' ? item.username : 'diskdarian'
    const card = document.createElement('a')
    card.className = 'instagram-feed-card'
    card.href = item.permalink
    card.target = '_blank'
    card.rel = 'noopener noreferrer'
    card.setAttribute('aria-label', caption ? `Open Instagram post: ${caption.slice(0, 100)}` : `Open Instagram post by @${username}`)

    const image = document.createElement('img')
    image.src = item.imageUrl
    image.alt = caption ? caption.slice(0, 140) : `Instagram post by @${username}`
    image.loading = 'lazy'
    image.decoding = 'async'
    card.appendChild(image)

    if (item.mediaType && item.mediaType !== 'IMAGE') {
      const mediaType = document.createElement('span')
      mediaType.className = 'instagram-feed-media-type'
      mediaType.textContent = item.mediaType === 'CAROUSEL_ALBUM' ? 'ALBUM' : item.mediaType
      card.appendChild(mediaType)
    }

    const overlay = document.createElement('span')
    overlay.className = 'instagram-feed-caption'
    overlay.textContent = caption || 'OPEN TRANSMISSION'
    card.appendChild(overlay)
    fragment.appendChild(card)
  }

  if (!fragment.childNodes.length) {
    showInstagramFallback()
    return
  }

  instagramFeedGrid.appendChild(fragment)
  instagramFeedGrid.setAttribute('aria-busy', 'false')
  instagramFeedStatus.textContent = `${items.length.toString().padStart(2, '0')} RECENT TRANSMISSIONS // SIGNAL ACTIVE`
}

async function loadInstagramFeed() {
  if (document.documentElement.classList.contains('background-mode')) return

  const controller = new AbortController()
  const timeout = window.setTimeout(() => controller.abort(), 8000)

  try {
    const response = await fetch('/api/instagram', {
      headers: { Accept: 'application/json' },
      signal: controller.signal
    })
    if (!response.ok) throw new Error('Instagram feed unavailable')
    renderInstagramFeed(await response.json())
  } catch (_error) {
    showInstagramFallback()
  } finally {
    window.clearTimeout(timeout)
  }
}

loadInstagramFeed()
